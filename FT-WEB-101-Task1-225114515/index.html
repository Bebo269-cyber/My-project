<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fatma - Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="page-header">
        <h1>Fatma</h1>

        <div class="top-bar">
            <div class="bar-name">Fatma</div>

            <nav class="bar-links">
                <a href="#" aria-label="link 1">Home</a>
                <a href="#" aria-label="link 2">Projects</a>
                <a href="#" aria-label="link 3">Contact</a>
            </nav>
        </div>
    </header>

    <main class="content">
        <img src="images/me.jpg"
             alt="A photo of Fatma"
             class="profile-photo" />

        <section class="cards" aria-label="Profile cards">
            <article class="card">
                <h3>Skills</h3>
                <p>HTML • CSS • JavaScript</p>
            </article>

            <article class="card">
                <h3>Hobbies</h3>
                <p>Reading • Football</p>
            </article>

            <article class="card">
                <h3>About Me</h3>
                <p>I love learning and building websites.</p>
            </article>
        </section>

        <section class="form-section">
            <form>
                <div class="field">
                    <label for="fullName">Full name</label>
                    <input id="fullName" type="text" name="fullName" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" required>
                </div>

                <button id="themeButton" type="button" class="theme-button">
                    Toggle Dark/Light
                </button>
            </form>
        </section>
    </main>

    <footer class="page-footer">
        <p>© 2026 Fatma. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
